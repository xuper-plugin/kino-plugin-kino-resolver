<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kino Resolver — docs para desarrolladores</title>
  <meta name="description" content="Un enlace de reproductor entra, un stream sale. Resolvedor universal de hosters/embeds para plugins de Kino, con una sola llamada." />
  <meta name="theme-color" content="#040A24" />
  <link rel="icon" href="https://kinotvapp.github.io/kino-plugins/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" />
  <style>
    :root {
      --ink: #040A24;
      --panel: #0A1538;
      --panel-2: #0E1E52;
      --line: #1B2C63;
      --blue: #2E9BFF;
      --blue-dim: #1E6FD0;
      --sky: #8FD0FF;
      --paper: #E7EEFB;
      --muted: #93A4C8;
      --amber: #F5B84A;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
      --display: 'Space Grotesk', var(--sans);

      --theme-color: var(--blue);
      --mono-font: var(--mono);
    }

    /* ---------- base ---------- */
    html, body { background: var(--ink); }
    body {
      font-family: var(--sans);
      color: var(--paper);
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0.1px;
    }
    /* a faint starfield / signal grid behind everything */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(1100px 620px at 78% -8%, rgba(46,155,255,0.16), transparent 60%),
        radial-gradient(760px 520px at 8% 108%, rgba(46,155,255,0.08), transparent 60%),
        linear-gradient(transparent 0 31px, rgba(27,44,99,0.14) 31px 32px),
        linear-gradient(90deg, transparent 0 31px, rgba(27,44,99,0.14) 31px 32px);
      background-size: auto, auto, 32px 32px, 32px 32px;
    }

    ::selection { background: rgba(46,155,255,0.32); color: #fff; }
    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-track { background: var(--ink); }
    ::-webkit-scrollbar-thumb { background: #16244f; border-radius: 10px; border: 2px solid var(--ink); }
    ::-webkit-scrollbar-thumb:hover { background: #20336e; }

    /* ---------- sidebar ---------- */
    .sidebar {
      background: linear-gradient(180deg, #060E2A, #04091F);
      border-right: 1px solid var(--line);
      padding-top: 10px;
    }
    .sidebar > h1 { margin: 18px 0 10px; padding: 0 22px; }
    .sidebar > h1 .app-name-link {
      font-family: var(--display);
      font-weight: 700; font-size: 20px; letter-spacing: -0.3px;
      color: var(--paper) !important; display: inline-flex; align-items: center; gap: 9px;
    }
    .sidebar > h1 .app-name-link::before {
      content: ""; width: 12px; height: 12px; border-radius: 3px;
      background: var(--blue); box-shadow: 0 0 14px rgba(46,155,255,0.9); flex: none;
      transform: rotate(45deg);
    }
    .sidebar .sidebar-nav { padding: 6px 12px 40px; line-height: 1.5; }
    .sidebar .sidebar-nav li a,
    .sidebar ul li a {
      color: #FFFFFF !important; font-size: 14.5px; font-weight: 500;
      padding: 7px 10px; border-radius: 8px; transition: background .15s, color .15s;
      border: 0;
    }
    .sidebar .sidebar-nav li a:hover,
    .sidebar ul li a:hover { color: #FFFFFF !important; background: rgba(46,155,255,0.16); }
    .sidebar-nav li.active > a {
      color: #fff !important; background: rgba(46,155,255,0.12);
      border-right: 0; font-weight: 600;
      box-shadow: inset 2px 0 0 var(--blue);
    }
    .sidebar-nav > ul > li > strong,
    .sidebar-nav p { color: #A9BCE3; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; padding: 16px 12px 4px; }
    .app-sub-sidebar li::before { color: var(--sky); }
    .sidebar-toggle { background: transparent; }
    .sidebar-toggle .sidebar-toggle-button span { background: var(--sky); }

    /* ---------- content ---------- */
    .content { background: transparent; }
    .markdown-section { max-width: 880px; padding: 34px 28px 120px; }
    .markdown-section > * { animation: none; }

    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      font-family: var(--display); color: #F3F7FF; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2;
    }
    .markdown-section h1 { font-size: 2.3rem; margin: 6px 0 6px; }
    .markdown-section h2 {
      font-size: 1.5rem; margin: 2.4em 0 0.7em; padding-top: 1.1em; border-top: 1px solid var(--line);
    }
    .markdown-section h2::before {
      content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 11px;
      background: var(--blue); transform: translateY(-2px) rotate(45deg); border-radius: 2px;
      box-shadow: 0 0 10px rgba(46,155,255,0.8);
    }
    .markdown-section h3 { font-size: 1.16rem; margin: 1.8em 0 0.5em; color: var(--sky); }
    .markdown-section p, .markdown-section li { color: #CFDAF0; font-size: 16px; line-height: 1.72; }
    .markdown-section strong { color: #fff; font-weight: 600; }
    .markdown-section a { color: var(--sky); text-decoration: none; border-bottom: 1px solid rgba(143,208,255,0.32); transition: border-color .15s, color .15s; }
    .markdown-section a:hover { color: #BFE4FF; border-bottom-color: var(--sky); }
    .markdown-section hr { border: 0; border-top: 1px solid var(--line); margin: 2.2em 0; }

    /* inline code */
    .markdown-section code {
      font-family: var(--mono); font-size: 0.86em; color: var(--sky);
      background: rgba(46,155,255,0.10); border: 1px solid rgba(46,155,255,0.18);
      padding: 1.5px 6px; border-radius: 6px; white-space: nowrap;
    }
    /* code blocks — a terminal panel */
    .markdown-section pre {
      background: #060E29; border: 1px solid var(--line); border-radius: 12px;
      margin: 1.3em 0; padding: 38px 0 4px; position: relative; box-shadow: 0 12px 34px rgba(0,0,0,0.38);
    }
    .markdown-section pre::before {
      content: "";
      position: absolute; top: 14px; left: 16px; width: 10px; height: 10px; border-radius: 50%;
      background: #2a3a6e;
      box-shadow: 18px 0 0 #2a3a6e, 36px 0 0 #2a3a6e;
    }
    .markdown-section pre::after {
      content: attr(data-lang);
      position: absolute; top: 11px; right: 16px; font-family: var(--mono); font-size: 11px;
      letter-spacing: 1.5px; color: #5a6c99; text-transform: uppercase;
    }
    .markdown-section pre > code {
      font-family: var(--mono); font-size: 13.5px; line-height: 1.65; color: #D7E3FB;
      background: transparent; border: 0; padding: 12px 18px; white-space: pre;
    }
    .token.comment { color: #5f7099; font-style: italic; }
    .token.string, .token.attr-value { color: #8fe0b0; }
    .token.number, .token.boolean { color: #f3b55c; }
    .token.keyword, .token.property { color: var(--sky); }
    .token.function { color: #c9a6ff; }
    .token.punctuation { color: #7b8cba; }

    /* blockquotes — a "signal note" */
    .markdown-section blockquote {
      background: rgba(46,155,255,0.06); border: 1px solid var(--line); border-left: 3px solid var(--blue);
      border-radius: 0 12px 12px 0; margin: 1.4em 0; padding: 14px 18px; color: #C2D1EE;
    }
    .markdown-section blockquote p { color: #C2D1EE; margin: 0.3em 0; font-size: 15px; }
    .markdown-section blockquote strong { color: var(--sky); }

    /* tables */
    .markdown-section table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 1.4em 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14.5px; display: table; }
    .markdown-section thead { background: linear-gradient(180deg, #112257, #0C1A45); }
    .markdown-section th { font-family: var(--display); color: #EAF2FF; font-weight: 600; text-align: left; padding: 12px 15px; border: 0; border-bottom: 1px solid var(--line); }
    .markdown-section td { color: #C2D1EE; padding: 11px 15px; border: 0; border-bottom: 1px solid rgba(27,44,99,0.6); }
    .markdown-section tr { background: transparent; border: 0; }
    .markdown-section tbody tr:nth-child(2n) { background: rgba(14,30,82,0.32); }
    .markdown-section tbody tr:hover { background: rgba(46,155,255,0.07); }
    .markdown-section td code { white-space: nowrap; }

    /* lists */
    .markdown-section ul { list-style: none; padding-left: 4px; }
    .markdown-section ul li { position: relative; padding-left: 22px; margin: 6px 0; }
    .markdown-section ul li::before { content: ""; position: absolute; left: 4px; top: 11px; width: 6px; height: 6px; background: var(--blue-dim); border-radius: 2px; transform: rotate(45deg); }
    .markdown-section ol { padding-left: 20px; }
    .markdown-section ol li { margin: 6px 0; }
    .markdown-section ol li::marker { color: var(--sky); font-family: var(--mono); font-weight: 700; }

    /* copy-code button */
    .docsify-copy-code-button {
      background: #15255a !important; color: var(--sky) !important; font-family: var(--mono) !important;
      font-size: 11px !important; border-radius: 7px !important; border: 1px solid var(--line) !important;
      top: 8px !important; right: 10px !important; padding: 4px 10px !important; opacity: 0; transition: opacity .15s;
    }
    .markdown-section pre:hover .docsify-copy-code-button { opacity: 1; }
    .docsify-copy-code-button:hover { background: #1c3270 !important; color: #fff !important; }
    .docsify-copy-code-button.success { background: #16463a !important; color: #8fe0b0 !important; }

    /* search */
    .search { border-bottom: 1px solid var(--line); margin-bottom: 0; }
    .search input { background: #081131; color: var(--paper); border-radius: 9px; font-size: 14px; border: 1px solid var(--line); }
    .search input::placeholder { color: #5f6f96; }
    .search .results-panel { background: var(--panel); }
    .search h2 { color: var(--sky); }
    .search .matching-post { border-bottom: 1px solid var(--line); }
    .search p { color: var(--muted); }

    /* ---------- COVER ---------- */
    .cover.show { background: transparent !important; color: var(--paper); }
    section.cover { padding: 0 16px; }
    section.cover .cover-main { max-width: 860px; margin: 0 auto; text-align: center; }
    section.cover .cover-main > p:last-child a { display: inline-block; }

    .hero-mark {
      font-family: var(--display); font-weight: 700; letter-spacing: -1.5px;
      font-size: clamp(2.6rem, 8vw, 4.6rem); line-height: 1.02; margin: 0 0 14px; color: #fff;
    }
    .hero-mark .r { color: #fff; }
    .hero-tag {
      font-family: var(--display); font-weight: 500; color: var(--sky);
      font-size: clamp(1.05rem, 2.6vw, 1.45rem); letter-spacing: -0.2px; margin: 0 auto 30px; max-width: 30ch;
    }

    /* the resolver conduit — the memorable element */
    .conduit {
      font-family: var(--mono); background: #060E29; border: 1px solid var(--line);
      border-radius: 16px; padding: 22px 20px; margin: 0 auto 26px; max-width: 640px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45); text-align: left; overflow: hidden; position: relative;
    }
    .conduit::after {
      content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(46,155,255,0.10);
    }
    .conduit .in { display: grid; gap: 7px; }
    .conduit .in span {
      font-size: 12.5px; color: #6f82b4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 5px 9px; background: rgba(27,44,99,0.4); border-radius: 7px; border: 1px solid var(--line);
    }
    .conduit .core {
      display: grid; place-items: center; gap: 6px; padding: 0 4px;
    }
    .conduit .node {
      width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px;
      background: radial-gradient(circle at 50% 35%, #2E9BFF, #124a92);
      box-shadow: 0 0 0 4px rgba(46,155,255,0.14), 0 0 26px rgba(46,155,255,0.55);
      color: #fff; font-weight: 700; font-size: 20px; transform: rotate(45deg);
      animation: pulse 3.4s ease-in-out infinite;
    }
    .conduit .node > span { transform: rotate(-45deg); }
    .conduit .arrow { color: var(--blue); font-size: 13px; letter-spacing: 2px; }
    .conduit .out {
      display: grid; gap: 6px; justify-items: end; text-align: right;
    }
    .conduit .out .m3u8 {
      font-size: 14px; color: #8fe0b0; font-weight: 700; padding: 7px 12px;
      background: rgba(46,255,170,0.08); border: 1px solid rgba(46,255,170,0.22); border-radius: 8px; white-space: nowrap;
    }
    .conduit .out .play { font-size: 11px; color: var(--sky); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(46,155,255,0.12), 0 0 20px rgba(46,155,255,0.40); }
      50%      { box-shadow: 0 0 0 7px rgba(46,155,255,0.20), 0 0 40px rgba(46,155,255,0.80); }
    }
    @media (prefers-reduced-motion: reduce) { .conduit .node { animation: none; } }

    .hero-stats {
      font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0 auto 30px;
      display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 10px 20px;
    }
    .hero-stats b { color: var(--sky); font-weight: 700; }

    /* cover buttons */
    section.cover .cover-main .buttons a,
    section.cover .cover-main > p a {
      font-family: var(--display); font-weight: 600; font-size: 15px;
      border-radius: 11px; padding: 13px 26px; margin: 8px 7px; border: 1px solid var(--line);
      transition: transform .12s, box-shadow .2s, background .2s; letter-spacing: 0.1px;
    }
    section.cover .cover-main a.btn-primary {
      background: var(--blue); color: #04142e !important; border-color: var(--blue);
      box-shadow: 0 10px 30px rgba(46,155,255,0.35);
    }
    section.cover .cover-main a.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(46,155,255,0.5); }
    section.cover .cover-main a.btn-ghost { background: rgba(46,155,255,0.06); color: var(--paper) !important; }
    section.cover .cover-main a.btn-ghost:hover { background: rgba(46,155,255,0.14); transform: translateY(-2px); }

    .cover-foot { font-family: var(--mono); font-size: 12px; color: #52628c; margin-top: 26px; }
    .cover-foot code { color: var(--sky); background: rgba(46,155,255,0.08); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); }

    @media (max-width: 600px) {
      .conduit { grid-template-columns: 1fr; gap: 12px; text-align: center; }
      .conduit .in span { white-space: normal; }
      .conduit .out { justify-items: center; }
      .conduit .arrow { transform: rotate(90deg); }
      .markdown-section { padding: 24px 18px 100px; }
    }
  </style>
</head>
<body>
  <div id="app">Cargando…</div>
  <script>
    window.$docsify = {
      name: 'Kino Resolver',
      repo: 'https://github.com/xuper-plugin/kino-plugin-kino-resolver',
      loadSidebar: true,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: { placeholder: 'Buscar en las docs…', noData: 'Sin resultados.', depth: 3 },
      copyCode: { buttonText: 'Copiar', errorText: 'Error', successText: 'Copiado' },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.0/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
</body>
</html>
